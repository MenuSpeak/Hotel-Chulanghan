<head>
<meta charset="UTF-8">

<title>Hotel Chulangan · अस्सल घरगुती जेवणाची चव..!</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============ RESET & VARIABLES ============ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --maroon:#5C0612;
  --maroon-light:#7A101F;
  --gold:#FFD166;
  --yellow:#FFD700;
  --cream:#FFF8E7;
  --cream-dim:#F5E6C8;
  --white:#FFFFFF;
  --shadow-sm:0 2px 8px rgba(92,6,18,.12);
  --shadow-md:0 8px 24px rgba(92,6,18,.18);
  --shadow-lg:0 16px 40px rgba(92,6,18,.24);
  --r-sm:12px;--r-md:20px;--r-lg:32px;
  --bounce:cubic-bezier(.34,1.56,.64,1);
  --smooth:cubic-bezier(.22,.61,.36,1);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--cream);color:var(--maroon);
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  line-height:1.55;min-height:100vh;overflow-x:hidden;
  display: flex;
  flex-direction: column;
}
h1,h2,h3,h4,h5,.brand,.hero-title,.section-title{font-family:'Bricolage Grotesque','Poppins',sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1.15}
a{color:inherit;text-decoration:none}
button{font-family:'Poppins',sans-serif;cursor:pointer;background:none;border:none;color:inherit;transition:all .2s var(--smooth)}
img{max-width:100%;display:block}

/* ============ LAYOUT ============ */
.container{max-width:1200px;margin:0 auto;padding:0 1.25rem;width: 100%;}

/* ============ HERO ============ */
.hero{
  background:linear-gradient(145deg,var(--maroon) 0%,var(--maroon-light) 100%);
  border-radius:0 0 40px 40px;
  padding:2rem 0 3rem;
  margin-bottom:2rem;
  position:relative;
  overflow:hidden;
  text-align: center;
  box-shadow: var(--shadow-md);
}
.hero::before{
  content:'';position:absolute;top:-50%;right:-10%;width:500px;height:500px;
  background:radial-gradient(circle,rgba(255,209,102,.15) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;animation:floatOrb 12s ease-in-out infinite
}
@keyframes floatOrb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-30px) scale(1.1)}}

.header-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}

/* Logo Area */
.logo-stage {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255,209,102,.3);
  border-radius: 50%;
  width: 180px;
  height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(255,209,102,.2);
  animation: corePulse 4s ease-in-out infinite;
  overflow: hidden;
  padding: 10px;
}
@keyframes corePulse{0%,100%{box-shadow:0 0 30px rgba(255,209,102,.2)}50%{box-shadow:0 0 50px rgba(255,209,102,.4)}}
.logo-stage img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 50%;
}

/* Text Area */
.brand-text h1 {
  font-size: clamp(2rem, 6vw, 3rem);
  color: var(--yellow);
  text-shadow: 0 4px 10px rgba(0,0,0,0.5);
  margin-bottom: 0.2rem;
}
.brand-sub {
  font-size: clamp(0.9rem, 3vw, 1.2rem);
  color: var(--white);
  font-weight: 500;
  background: rgba(255,255,255,0.1);
  padding: 0.4rem 1.2rem;
  border-radius: 50px;
  display: inline-block;
  margin-bottom: 0.8rem;
}
.brand-tagline {
  font-size: clamp(1rem, 3.5vw, 1.3rem);
  color: var(--gold);
  font-weight: 600;
  font-style: italic;
}

/* ============ LINKS / BUTTONS SECTION ============ */
.links-section {
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
  max-width: 500px;
  margin: 0 auto;
  padding: 0 1rem 3rem;
}

.action-card {
  background: var(--white);
  border-radius: var(--r-md);
  padding: 1.2rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1.2rem;
  box-shadow: var(--shadow-sm);
  border: 2px solid transparent;
  transition: transform 0.3s var(--bounce), box-shadow 0.3s, border-color 0.3s;
  position: relative;
  overflow: hidden;
}
.action-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-md);
  border-color: var(--gold);
}
.action-icon {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  flex-shrink: 0;
  color: var(--white);
}
.action-icon.insta { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
.action-icon.map { background: #4285F4; }

.action-info {
  flex: 1;
  text-align: left;
}
.action-info h3 {
  font-size: 1.2rem;
  color: var(--maroon);
  margin-bottom: 0.2rem;
}
.action-info p {
  font-size: 0.85rem;
  color: #666;
  font-weight: 500;
}
.action-arrow {
  font-size: 1.2rem;
  color: var(--maroon);
  opacity: 0.3;
  transition: opacity 0.3s, transform 0.3s;
}
.action-card:hover .action-arrow {
  opacity: 1;
  transform: translateX(5px);
  color: var(--gold);
}

/* ============ MENU IMAGES SECTION ============ */
.menu-section {
  background: var(--white);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding: 2.5rem 1rem 3rem;
  box-shadow: var(--shadow-sm);
  max-width: 900px;
  margin: 0 auto;
  border-top: 6px solid var(--maroon);
  text-align: center;
}

.menu-header {
  margin-bottom: 2rem;
}
.menu-header h2 {
  font-size: 2rem;
  color: var(--maroon);
  margin-bottom: 0.3rem;
}
.menu-header p {
  color: #666;
  font-size: 0.95rem;
  font-weight: 500;
}

.menu-gallery {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  align-items: center;
}

.menu-gallery img {
  width: 100%;
  max-width: 800px;
  height: auto;
  border-radius: var(--r-sm);
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  border: 1px solid rgba(92,6,18,0.1);
  transition: transform 0.3s ease;
}

.menu-gallery img:hover {
  transform: scale(1.01);
}

/* ============ MAIN CONTENT INFO ============ */
.info-section {
  background: var(--white);
  border-radius: var(--r-lg);
  padding: 2.5rem 1.5rem;
  box-shadow: var(--shadow-sm);
  max-width: 800px;
  margin: 2rem auto 3rem;
  border-top: 6px solid var(--maroon);
  text-align: center;
}
.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 2rem;
  margin-top: 1.5rem;
}
.info-item h4 {
  color: var(--maroon);
  font-size: 1.1rem;
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}
.info-item h4 i { color: var(--gold); }
.info-item p {
  font-size: 0.95rem;
  color: #555;
  line-height: 1.6;
}

/* ============ FOOTER ============ */
.footer{
  text-align:center;
  padding:2rem 0;
  background: var(--maroon);
  color: var(--cream-dim);
  font-size:.85rem;
  margin-top: auto;
  border-radius: 40px 40px 0 0;
}
.footer i{color:var(--yellow);animation:heartbeat 1.5s ease-in-out infinite;display:inline-block}
@keyframes heartbeat{0%,100%{transform:scale(1)}25%{transform:scale(1.2)}50%{transform:scale(1)}75%{transform:scale(1.15)}}
.footer p { margin-bottom: 0.3rem; }

/* ============ RESPONSIVE ============ */
@media (max-width: 480px){
  .logo-stage { width: 140px; height: 140px; }
  .action-card { padding: 1rem; gap: 1rem; }
  .action-icon { width: 45px; height: 45px; font-size: 1.4rem; }
  .info-section { padding: 1.5rem 1rem; }
  .menu-section { padding: 1.5rem 0.5rem; }
  .menu-gallery { gap: 1rem; }
  .menu-gallery img { border-radius: 8px; }
}
</style>
</head>
